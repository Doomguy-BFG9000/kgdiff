<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">kgdiff — git diff for knowledge graphs</title>
  <!--
    Open Graph card, the source of og.png: a 1200 by 630 screenshot of this SVG, inlined in an
    HTML page, taken with headless Chrome. (No double hyphens in here: XML comments forbid them.)
    Drawn in the visual language of docs/visual-language.md (dark "night" tokens).
  -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#94A3B8" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="glowA" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7C9CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7C9CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloI">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".32"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloA">
      <stop offset="0" stop-color="#34D399" stop-opacity=".32"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <marker id="ahI" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#A78BFA"/></marker>
    <marker id="ahS" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#38BDF8"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#0B0E14"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>

  <!-- Graph diff illustration (right) -->
  <g stroke-linecap="round">
    <g stroke="#323A4A" stroke-width="2" fill="none">
      <path d="M880 170 980 120M880 170 800 110M1010 330 1100 300M1010 330 1080 410M760 420 690 470M760 420 700 360M940 500 1010 560M940 500 860 560M880 170 940 260"/>
    </g>
    <g fill="#4B5568" stroke="#5E687C" stroke-width="1.5">
      <circle cx="980" cy="120" r="7"/><circle cx="800" cy="110" r="6"/><circle cx="1100" cy="300" r="6"/>
      <circle cx="1080" cy="410" r="7"/><circle cx="690" cy="470" r="6"/><circle cx="700" cy="360" r="6"/>
      <circle cx="1010" cy="560" r="6"/><circle cx="860" cy="560" r="6"/><circle cx="880" cy="170" r="9"/>
    </g>
    <!-- move: old edge ghost, new edge + pivot -->
    <path d="M940 260 768 410" stroke="#F87171" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="6 4.5" fill="none"/>
    <path d="M940 260 1000 322" stroke="#38BDF8" stroke-width="2.5" fill="none" marker-end="url(#ahS)"/>
    <circle cx="760" cy="420" r="10" fill="#4B5568" stroke="#5E687C" stroke-width="1.5"/>
    <circle cx="1010" cy="330" r="10" fill="#4B5568" stroke="#5E687C" stroke-width="1.5"/>
    <circle cx="940" cy="260" r="13" fill="#38BDF8"/>
    <circle cx="940" cy="260" r="18" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="948.5" cy="268.8" r="4" fill="#38BDF8" stroke="#0B0E14" stroke-width="1.5"/>
    <!-- merge -->
    <path d="M708 214Q760 170 828 168" stroke="#A78BFA" stroke-opacity=".9" stroke-width="2.25" fill="none" marker-end="url(#ahI)"/>
    <circle cx="880" cy="170" r="44" fill="url(#haloI)"/>
    <circle cx="880" cy="170" r="13" fill="#A78BFA"/>
    <circle cx="880" cy="170" r="18" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="696" cy="226" r="11" fill="#0B0E14" stroke="#A78BFA" stroke-width="2.25" stroke-dasharray="4.5 3.5"/>
    <!-- added -->
    <path d="M940 500 1010 330" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <circle cx="940" cy="500" r="40" fill="url(#haloA)"/>
    <circle cx="940" cy="500" r="12" fill="#34D399"/>
    <!-- removed ghost -->
    <path d="M760 420 640 560" stroke="#F87171" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 4.5" fill="none"/>
    <circle cx="640" cy="560" r="10" fill="#0B0E14" stroke="#F87171" stroke-width="2.25" stroke-dasharray="4.5 3.5"/>
    <!-- rename -->
    <circle cx="1080" cy="410" r="11" fill="#FBBF24"/>
    <circle cx="1080" cy="410" r="16" fill="none" stroke="#FBBF24" stroke-width="2"/>
  </g>
  <g font-family="Inter, 'SF Pro Text', -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" text-anchor="middle" paint-order="stroke" stroke="#0B0E14" stroke-width="5" stroke-linejoin="round">
    <text x="880" y="216" font-size="17" font-weight="600" fill="#E7EBF3">myocardial infarction</text>
    <text x="696" y="262" font-size="15" fill="#737D8F">heart attack</text>
    <text x="940" y="306" font-size="17" font-weight="600" fill="#E7EBF3">Crohn disease</text>
    <text x="940" y="542" font-size="17" font-weight="600" fill="#E7EBF3">受益所有人</text>
    <text x="1080" y="450" font-size="16" font-weight="600" fill="#E7EBF3">MASLD</text>
    <text x="1080" y="472" font-size="14" fill="#737D8F" stroke="none">NAFLD</text><path d="M1059 467h42" stroke="#737D8F" stroke-width="1.3"/>
  </g>

  <!-- Copy (left) -->
  <g transform="translate(80 92)">
    <g transform="scale(1.75)">
      <path d="M12.7 14 9.4 20.1" fill="none" stroke="#F87171" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2.4 2.1"/>
      <path d="m19.3 14 3.3 6.1" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M12 24.5h8" fill="none" stroke="#5E687C" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="8" r="5.9" fill="none" stroke="#A78BFA" stroke-width="1.4" opacity=".85"/>
      <circle cx="16" cy="8" r="3.4" fill="#A78BFA"/>
      <circle cx="7" cy="24.5" r="3.3" fill="none" stroke="#F87171" stroke-width="1.5" stroke-dasharray="2.2 1.65"/>
      <circle cx="25" cy="24.5" r="3.6" fill="#34D399"/>
    </g>
    <text x="72" y="40" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-1.2" fill="#E7EBF3">kgdiff</text>
  </g>
  <g font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" fill="#E7EBF3">
    <text x="80" y="270" font-size="68" font-weight="700" letter-spacing="-2.8">git diff for</text>
    <text x="80" y="346" font-size="68" font-weight="700" letter-spacing="-2.8">knowledge graphs</text>
    <text x="82" y="408" font-size="25" fill="#A6AFBF" letter-spacing="-.2">Review AI-written graph changes like a pull request.</text>
    <text x="82" y="442" font-size="25" fill="#A6AFBF" letter-spacing="-.2">Merges, renames, moves — on one stable map.</text>
  </g>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="20">
    <rect x="80" y="496" width="404" height="52" rx="12" fill="#11151D" stroke="#fff" stroke-opacity=".13"/>
    <text x="102" y="529" fill="#737D8F">$</text>
    <text x="126" y="529" fill="#E7EBF3">npx @kgdiff/cli a.ttl b.ttl</text>
  </g>
</svg>
