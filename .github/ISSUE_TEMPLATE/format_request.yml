name: Format support request
description: Ask kgdiff to read a graph format it does not support yet, or to map one better.
labels: [formats]
body:
  - type: markdown
    attributes:
      value: |
        kgdiff reads Turtle, N-Triples, N-Quads, TriG, OBO 1.4 and the JSON graph shapes of kgdiff,
        d3 / NetworkX, Cytoscape.js, AntV G6 v5, graphology and vis-network. How they map to nodes and
        edges: [docs/architecture.md](../blob/main/docs/architecture.md#formats-mapping-conventions).
  - type: input
    id: format
    attributes:
      label: Format
      placeholder: e.g. JSON-LD, GraphML, OWL Functional Syntax
    validations:
      required: true
  - type: input
    id: specification
    attributes:
      label: Specification
      description: A link to the format's specification or documentation.
  - type: textarea
    id: sample
    attributes:
      label: Sample files
      description: |
        A small file in this format, ideally a before / after pair (attach it or link it). Remove
        anything confidential first.
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Expected mapping
      description: |
        What should become node ids, labels, types, aliases and attributes, which relations are
        edges, and which of them form the hierarchy (like `rdfs:subClassOf` or OBO `is_a`)?
  - type: textarea
    id: usage
    attributes:
      label: Where the files come from
      description: Which tools produce or consume them, and how large they get (nodes, edges, MB).
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I can provide more sample files.
        - label: I would like to implement the parser (see CONTRIBUTING.md).
