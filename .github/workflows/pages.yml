name: Pages

# Builds apps/site (landing page + playground) and deploys it to GitHub Pages.
# The base path comes from the Pages configuration (`/<repo>/` for project sites, `/` with a
# custom domain) and is passed to Vite as KGDIFF_SITE_BASE.

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/**
      - examples/datasets/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: pnpm vite build --config apps/site/vite.config.ts
        env:
          KGDIFF_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          KGDIFF_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          KGDIFF_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
