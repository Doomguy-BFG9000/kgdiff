<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kgdiff G6 harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --overlay: rgba(17, 21, 29, 0.78);
        --border: rgba(255, 255, 255, 0.07);
        --text: #e7ebf3;
        --muted: #a6afbf;
        --accent: #7c9cff;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f7f8fa;
        --overlay: rgba(255, 255, 255, 0.82);
        --border: rgba(15, 23, 42, 0.08);
        --text: #0f172a;
        --muted: #475569;
        --accent: #3b5bdb;
        --shadow: 0 8px 28px rgba(15, 23, 42, 0.1), 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', system-ui, sans-serif;
        overflow: hidden;
      }
      /* G6 sets its container to position: relative / display: grid inline: size a wrapper. */
      #frame {
        position: fixed;
        inset: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      .card {
        position: fixed;
        background: var(--overlay);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
      }
      #panel {
        top: 16px;
        left: 16px;
        width: 320px;
        max-height: calc(100% - 32px);
        display: grid;
        gap: 10px;
        overflow: auto;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      h1 span,
      .muted {
        color: var(--muted);
        font-weight: 400;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      legend.label {
        float: left;
        padding: 0;
      }
      .row > .label {
        width: 64px;
        color: var(--muted);
      }
      button,
      select {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 10px;
        min-height: 28px;
        cursor: pointer;
      }
      select option {
        color: #0f172a;
      }
      button:hover {
        border-color: var(--accent);
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #hunks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      #hunks button {
        width: 100%;
        text-align: left;
        border-color: transparent;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      #hunks button[aria-pressed='true'] {
        background: transparent;
        color: var(--text);
        border-color: var(--accent);
      }
      .bar {
        width: 3px;
        align-self: stretch;
        border-radius: 2px;
        flex: none;
      }
      #status {
        font: 12px/1.5 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
        min-height: 36px;
      }
      #hint {
        right: 16px;
        top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="stage"></div></div>
    <section id="panel" class="card" aria-label="Harness controls">
      <h1>kgdiff × G6 <span>· dev harness</span></h1>
      <div class="row">
        <span class="label">Dataset</span>
        <select id="dataset" aria-label="Dataset"></select>
      </div>
      <fieldset class="row">
        <legend class="label">Layer</legend>
        <button type="button" data-layer="union" aria-pressed="true">Union</button>
        <button type="button" data-layer="before" aria-pressed="false">Before</button>
        <button type="button" data-layer="after" aria-pressed="false">After</button>
      </fieldset>
      <div class="row">
        <span class="label">Replay</span>
        <button type="button" id="play">Play</button>
        <button type="button" id="stop">Stop</button>
        <select id="speed" aria-label="Replay speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
      <fieldset class="row">
        <legend class="label">Theme</legend>
        <button type="button" data-theme="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" id="palette" aria-pressed="false">Color-blind</button>
      </fieldset>
      <div id="status" aria-live="polite"></div>
      <ul id="hunks" aria-label="Hunks"></ul>
    </section>
    <div id="hint" class="card">Drag to pan · wheel to zoom · click a change · click canvas to clear</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
